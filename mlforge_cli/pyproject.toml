[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-forge-cli"
version = "0.1.1"
description = "MLForge Command Line Interface"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "ml-forge-sdk",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.6",
    "structlog>=23.1.0",
    "aiofiles>=23.1.0",
    "aiosqlite>=0.19.0",
    "tenacity>=8.0.0",
    "tqdm>=4.65.0",
    "psutil>=5.9.0",
    "pynvml>=11.5.0",
    "huggingface_hub>=0.20.0",
    "py-cpuinfo>=9.0.0",
]

[tool.setuptools.package-data]
mlforge_cli = ["bin/**/*", "static/**/*"]

[project.scripts]
mlforge = "mlforge_cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["mlforge_cli*"]
